# ============================================================
# Supabase heartbeat — houdt het gratis Supabase-project wakker
# (gratis projecten pauzeren na 7 dagen zonder databaseactiviteit)
#
# Pad in de repo: .github/workflows/heartbeat.yml
#
# PUBLISHABLE_KEY hieronder = dezelfde publishable key als in
# uitstappen.html (Supabase: Project Settings > API Keys).
# Hij gaat enkel als apikey mee, niet als Bearer: de nieuwe
# sleutels zijn geen JWT. (Sinds november 2026; voordien de
# oude anon-sleutel.)
#
# Werking: elke dag om 06:17 (UTC) één mini-query op de database
# (= activiteit voor Supabase). Dit is de reserve; de primaire
# keep-alive is cron-job.org (elke 15 minuten). GitHub kan een
# geplande workflow uitschakelen na 60 dagen zonder activiteit
# in de repo; daarom is cron-job.org de primaire laag.
# ============================================================
name: Supabase heartbeat

on:
  schedule:
    - cron: "17 6 * * *"   # elke dag om 06:17 UTC
  workflow_dispatch:          # ook manueel te starten via Actions-tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPA_URL: https://vmvxawjfryaijkhhnnyr.supabase.co
      PUBLISHABLE_KEY: sb_publishable_Xg0ezCxtbHfReSOcigRXvw_j5fwRjqg
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Ping Supabase database
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPA_URL/rest/v1/uitstappen?select=id&limit=1" \
              -H "apikey: $PUBLISHABLE_KEY")
            echo "Poging $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Heartbeat OK, de database is wakker."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Heartbeat mislukt na 3 pogingen (laatste status: $STATUS). Staat er 000? Dan is het Supabase-project gepauzeerd — herstel het via het Supabase-dashboard. Staat er 401? Dan klopt de publishable key niet meer (Supabase: Project Settings > API Keys)."
          exit 1
