      <button class="btn-link" data-sadd="busmaatschappijen">${ic("plus",14)}Busmaatschappij toevoegen</button></div>

    <div class="card set-card full"><div><div class="section-title">Offerteaanvraag busritten</div><div class="section-sub">Deze gegevens komen bovenaan het Excel-bestand dat je naar de busmaatschappijen stuurt. Het vertrekadres is ook het vertrekpunt van elke rit.</div></div>
      <div class="grid">${[["school","School",4,"text"],["contact","Contactpersoon",4,"text"],["mail","E-mail",4,"email"],["tel","Telefoon",4,"tel"],["vertrek","Vertrekadres (school)",8,"text"]]
        .map(([k,l,sp,ty])=>`<div class="field span${sp}"><label for="so_${k}">${l}</label><input class="ctrl" id="so_${k}" data-so="${k}" type="${ty}" value="${esc(OFF()[k]||"")}"></div>`).join("")}</div></div>

    <div class="card set-card full"><div><div class="section-title">Klassen</div><div class="section-sub">Klik op een klas om ze te verplaatsen. Een klas die niet meer bestaat, zet je op niet actief: oude uitstappen blijven dan correct.</div></div>
      <div class="move-bar"><span class="hint" id="klSelTxt">${ui.selKlas?`<b>${esc((s.klassen.find(k=>k.id===ui.selKlas)||{}).naam||"")}</b> geselecteerd`:"Geen klas geselecteerd"}</span>
        <button class="btn btn-ghost btn-sm" data-kmove="-1"${ui.selKlas?"":" disabled"}>${ic("arrowUp",14)}Omhoog</button><button class="btn btn-ghost btn-sm" data-kmove="1"${ui.selKlas?"":" disabled"}>${ic("arrowDown",14)}Omlaag</button></div>
      <div class="set-grid" style="gap:12px 20px">${GROEPEN.map(g=>`<div><div class="set-sub">${g}</div><div class="set-list" style="margin-top:6px">
        ${s.klassen.filter(k=>k.groep===g).map(k=>`<div class="srow klas${ui.selKlas===k.id?" is-sel":""}${k.actief?"":" off"}" data-ksel="${esc(k.id)}">
          <input class="ctrl" data-kname="${esc(k.id)}" value="${esc(k.naam)}" aria-label="Naam klas ${esc(k.naam)}">
          <select class="ctrl" data-kgroep="${esc(k.id)}" aria-label="Groep ${esc(k.naam)}">${GROEPEN.map(x=>`<option${x===k.groep?" selected":""}>${x}</option>`).join("")}</select>
          <label class="check-row k-act" style="font-size:13px"><input type="checkbox" data-kact="${esc(k.id)}"${k.actief?" checked":""}> actief</label>
          <button class="icon-btn" data-kdel="${esc(k.id)}" aria-label="Verwijder ${esc(k.naam)}" title="${usedBy(k.naam)?"In gebruik: zet liever op niet actief":"Verwijderen"}">${ic("trash",15)}</button></div>`).join("")||`<div class="hint">Geen klassen.</div>`}
        </div></div>`).join("")}
        <div><div class="set-sub">Klas toevoegen</div><div class="srow" style="grid-template-columns:minmax(0,1fr) 120px auto;margin-top:6px">
          <input class="ctrl" id="klNew" placeholder="bv. 1KC" aria-label="Naam nieuwe klas"><select class="ctrl" id="klNewG" aria-label="Groep nieuwe klas">${GROEPEN.map(x=>`<option>${x}</option>`).join("")}</select><button class="btn btn-primary btn-sm" id="klAdd">${ic("plus",14)}Toevoegen</button></div></div>
      </div></div>

    <div class="card set-card full"><div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap"><div style="margin-right:auto"><div class="section-title">Vakanties en vrije dagen</div><div class="section-sub">Verschijnen in de kalender en als waarschuwing in het formulier.</div></div>
        <select class="sel set" id="setSJ" aria-label="Schooljaar">${[cur,sjShift(cur,1)].map(y=>`<option${y===ui.setSJ?" selected":""}>${y}</option>`).join("")}</select>
        <button class="btn btn-ghost btn-sm" id="vakStel" style="height:40px">${ic("cal",15)}Wettelijke data voorstellen</button></div>
      <div class="set-grid" style="gap:12px 20px">
        <div><div class="set-sub">Vakanties</div><div class="set-list" style="margin-top:6px"><div class="srow vak srow-h"><span>Naam</span><span>Van</span><span>Tot en met</span><span></span></div>
          ${vak.map(v=>`<div class="srow vak">${inp("vakanties",v.id,"naam",v.naam,{al:"Naam vakantie"})}${inp("vakanties",v.id,"van",v.van,{type:"date",al:"Begin "+v.naam})}${inp("vakanties",v.id,"tot",v.tot,{type:"date",al:"Einde "+v.naam})}${del("vakanties",v.id,"Verwijder "+v.naam)}</div>`).join("")||`<div class="hint">Nog geen vakanties voor ${esc(ui.setSJ)}. Klik op Wettelijke data voorstellen.</div>`}
          </div><button class="btn-link" data-sadd="vakanties" style="margin-top:6px">${ic("plus",14)}Vakantie toevoegen</button></div>
        <div><div class="set-sub">Vrije dagen</div><div class="set-list" style="margin-top:6px"><div class="srow vrij srow-h"><span>Naam</span><span>Datum</span><span></span></div>
          ${vrij.map(v=>`<div class="srow vrij">${inp("vrijedagen",v.id,"naam",v.naam,{al:"Naam vrije dag"})}${inp("vrijedagen",v.id,"datum",v.datum,{type:"date",al:"Datum "+v.naam})}${del("vrijedagen",v.id,"Verwijder "+v.naam)}</div>`).join("")||`<div class="hint">Nog geen vrije dagen voor ${esc(ui.setSJ)}.</div>`}
          </div><button class="btn-link" data-sadd="vrijedagen" style="margin-top:6px">${ic("plus",14)}Vrije dag toevoegen</button></div>
      </div></div>

    <div class="card set-card full"><div><div class="section-title">Meldingen</div><div class="section-sub">Schoolactiviteiten zoals de schoolfotograaf of een studiedag. Toevoegen kan ook door in de kalender op een dag te klikken.</div></div>
      <div class="set-list"><div class="srow vak srow-h"><span>Omschrijving</span><span>Datum</span><span>Tot en met</span><span></span></div>
      ${mel.map(m=>`<div class="srow vak">${inp("meldingen",m.id,"naam",m.naam,{al:"Omschrijving melding"})}${inp("meldingen",m.id,"datum",m.datum,{type:"date",al:"Datum "+m.naam})}${inp("meldingen",m.id,"datumEind",m.datumEind,{type:"date",al:"Einddatum "+m.naam})}${del("meldingen",m.id,"Verwijder "+m.naam)}</div>`).join("")||`<div class="hint">Geen meldingen.</div>`}</div>
      <button class="btn-link" data-sadd="meldingen">${ic("plus",14)}Melding toevoegen</button></div>
  </div>`;
  bindInstellingen(host);
}
function bindInstellingen(host){
  if(host._bound) return; host._bound=true;
  host.addEventListener("change",async e=>{
    const el=e.target;
    if(el.id==="setSJ"){ ui.setSJ=el.value; renderInstellingen(); return; }
    if(el.dataset.s){
      const [coll,id,f]=el.dataset.s.split("|"), v=el.value.trim();
      if(el.type==="date" && v && !parseISO(v)){ toast("Geen geldige datum","err"); return; }
      if(f==="naam" && !v){ toast("Een naam mag niet leeg zijn","err"); renderInstellingen(); return; }
      if(el.type==="email" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast("Controleer het e-mailadres","err"); return; }
      try{ await mutateSettings(s=>{ const x=s[coll].find(y=>y.id===id); if(!x) return; x[f]=v||null;
          if(coll==="vakanties" && x.van && x.tot && x.tot<x.van) x.tot=x.van; });
        renderHeader(); toast("Bewaard"); }catch(er){ dbFail(er,"Bewaren"); }
      return;
    }
    if(el.dataset.so){ const k=el.dataset.so, v=el.value.trim();
      if(el.type==="email" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast("Controleer het e-mailadres","err"); return; }
      try{ await beheerPatch(OFF_ID,{[k]:v}); toast("Bewaard"); }catch(er){ dbFail(er,"Bewaren"); } return; }
    if(el.dataset.kname){ renameKlas(el.dataset.kname,el.value.trim()); return; }
    if(el.dataset.kgroep){ try{ await mutateSettings(s=>{ const k=s.klassen.find(x=>x.id===el.dataset.kgroep); if(k) k.groep=el.value; }); renderInstellingen(); toast("Bewaard"); }catch(er){ dbFail(er,"Bewaren"); } return; }
    if(el.dataset.kact){ const on=el.checked; try{ await mutateSettings(s=>{ const k=s.klassen.find(x=>x.id===el.dataset.kact); if(k) k.actief=on; }); renderInstellingen(); toast(on?"Klas weer actief":"Klas op niet actief gezet. Oude uitstappen blijven zichtbaar."); }catch(er){ dbFail(er,"Bewaren"); } }
  });
  host.addEventListener("click",async e=>{
    const t=e.target; let el;
    if((el=t.closest("[data-sdel]"))){ const [coll,id]=el.dataset.sdel.split("|"); removeWithUndo(coll,id,"Verwijderd"); return; }
    if((el=t.closest("[data-sadd]"))){
      const coll=el.dataset.sadd, [a]=sjRange(ui.setSJ), d=todayISO()>=a?todayISO():a;
      const item = coll==="vakanties"?{id:uid(),naam:"Nieuwe vakantie",van:d,tot:d}:coll==="vrijedagen"?{id:uid(),naam:"Nieuwe vrije dag",datum:d}:coll==="meldingen"?{id:uid(),naam:"Nieuwe melding",datum:todayISO(),datumEind:null}:{id:uid(),naam:"Nieuwe busmaatschappij",email:"",tel:""};
      try{ await mutateSettings(s=>{ s[coll].push(item); }); renderInstellingen(); const inp=qs(`[data-s="${coll}|${item.id}|naam"]`); if(inp){ inp.focus(); inp.select(); } }catch(er){ dbFail(er,"Toevoegen"); }
      return;
    }
    if(t.closest("#vakStel")){ stelVakantiesVoor(ui.setSJ); return; }
    if(t.closest("#klAdd")){ addKlas(); return; }
    if((el=t.closest("[data-kdel]"))){ delKlas(el.dataset.kdel); return; }
    if((el=t.closest("[data-kmove]"))){ moveKlas(+el.dataset.kmove); return; }
    if((el=t.closest("[data-ksel]")) && !t.closest("input,select,button,label")){ ui.selKlas = ui.selKlas===el.dataset.ksel ? null : el.dataset.ksel; renderInstellingen(); }
  });
  host.addEventListener("keydown",e=>{ if(e.target.id==="klNew" && e.key==="Enter") addKlas(); });
}
async function stelVakantiesVoor(sj){
  const w=wettelijkeDagen(sj), s=S();
  const nv=w.vakanties.filter(v=>!s.vakanties.some(x=>x.van===v.van&&x.tot===v.tot));
  const nd=w.vrijedagen.filter(v=>!s.vrijedagen.some(x=>x.datum===v.datum));
  if(!nv.length && !nd.length){ toast(`Alle wettelijke data voor ${sj} staan er al`); return; }
  const ok=await confirmDialog({title:`Wettelijke data voor ${sj} toevoegen?`,html:`<p>Berekend volgens de vaste regels van het Vlaamse onderwijs. Kijk ze na; pedagogische studiedagen van de school voeg je zelf toe.</p>
    <div class="set-list" style="margin-top:10px;font-size:13.5px">${nv.map(v=>`<div>${esc(v.naam)}: <b>${esc(fmtDY(v.van))}</b> t.e.m. <b>${esc(fmtDY(v.tot))}</b></div>`).join("")}${nd.map(v=>`<div>${esc(v.naam)}: <b>${esc(fmtDY(v.datum))}</b></div>`).join("")}</div>`,ok:"Toevoegen"});
  if(!ok) return;
  try{ await mutateSettings(x=>{ nv.forEach(v=>x.vakanties.push(Object.assign({id:uid()},v))); nd.forEach(v=>x.vrijedagen.push(Object.assign({id:uid()},v))); }); renderAll(); toast(`${nv.length+nd.length} data toegevoegd`); }
  catch(e){ dbFail(e,"Toevoegen"); }
}
async function addKlas(){
  const n=$("klNew").value.trim(), g=$("klNewG").value;
  if(!n){ $("klNew").focus(); return; }
  if(S().klassen.some(k=>fold(k.naam)===fold(n))){ toast(`Klas ${n} bestaat al`,"err"); return; }
  try{ await mutateSettings(s=>{ s.klassen.push({id:uid(),naam:n,groep:g,actief:true}); }); renderAll(); toast(`Klas ${n} toegevoegd`); setTimeout(()=>{ const i=$("klNew"); if(i) i.focus(); },30); }
  catch(e){ dbFail(e,"Toevoegen"); }
}
async function delKlas(id){
  const k=S().klassen.find(x=>x.id===id); if(!k) return;
  const n=D.trips.filter(t=>!t.verwijderdOp&&t.klassen.includes(k.naam)).length;
  if(n){ const ok=await confirmDialog({title:`Klas ${k.naam} is in gebruik`,html:`<p>${plural(n,"uitstap verwijst","uitstappen verwijzen")} naar ${esc(k.naam)}. Verwijderen kan daarom niet. Zet de klas op <b>niet actief</b>: ze verdwijnt dan uit de keuzes, maar oude uitstappen blijven correct.</p>`,ok:"Op niet actief zetten",cancel:"Annuleren"});
    if(ok){ try{ await mutateSettings(s=>{ const x=s.klassen.find(y=>y.id===id); if(x) x.actief=false; }); renderAll(); toast("Klas op niet actief gezet"); }catch(e){ dbFail(e,"Bewaren"); } } return; }
  if(ui.selKlas===id) ui.selKlas=null;
  removeWithUndo("klassen",id,`Klas ${k.naam} verwijderd`);
}
async function moveKlas(dir){
  const id=ui.selKlas; if(!id) return;
  try{ await mutateSettings(s=>{ const k=s.klassen.find(x=>x.id===id); if(!k) return; const same=s.klassen.filter(x=>x.groep===k.groep), i=same.indexOf(k), j=i+dir; if(j<0||j>=same.length) return;
      const other=same[j], a=s.klassen.indexOf(k), b=s.klassen.indexOf(other); s.klassen[a]=other; s.klassen[b]=k; }); renderInstellingen(); }
  catch(e){ dbFail(e,"Verplaatsen"); }
}
async function renameKlas(id,nieuw){
  const k=S().klassen.find(x=>x.id===id); if(!k) return;
  if(!nieuw || nieuw===k.naam){ renderInstellingen(); return; }
  if(S().klassen.some(x=>x.id!==id && fold(x.naam)===fold(nieuw))){ toast(`Klas ${nieuw} bestaat al`,"err"); renderInstellingen(); return; }
  const oud=k.naam, van=sjRange(huidigSJ())[0];
  const affected=D.trips.filter(t=>!t.verwijderdOp && t.klassen.includes(oud) && t.datumStart>=van);
  const older=D.trips.filter(t=>t.klassen.includes(oud) && t.datumStart<van).length;
  const ok=await confirmDialog({title:`Klas ${oud} hernoemen naar ${nieuw}?`,html:`<p>${affected.length?`${plural(affected.length,"uitstap","uitstappen")} van dit schooljaar en later ${affected.length===1?"krijgt":"krijgen"} de nieuwe naam.`:"Er zijn geen uitstappen van dit schooljaar met deze klas."}${older?` Uitstappen van vorige schooljaren behouden <b>${esc(oud)}</b>, zodat het archief klopt.`:""}</p>`,ok:"Hernoemen"});
  if(!ok){ renderInstellingen(); return; }
  try{ await mutateSettings(s=>{ const x=s.klassen.find(y=>y.id===id); if(x) x.naam=nieuw; }); }
  catch(e){ dbFail(e,"Hernoemen"); renderAll(); return; }      // niets gewijzigd
  await hernoemInUitstappen(oud,nieuw);
}
/* De uitstappen één voor één bijwerken. Lukt het bij sommige niet, dan zegt de melding hoeveel,
   en "Opnieuw proberen" werkt enkel de uitstappen bij die nog de oude naam hebben. */
async function hernoemInUitstappen(oud,nieuw){
  const van=sjRange(huidigSJ())[0];
  const todo=D.trips.filter(t=>!t.verwijderdOp && t.klassen.includes(oud) && t.datumStart>=van);
  let fout=0, laatste=null;
  for(const t of todo){
    try{ await patchTrip(t.id,x=>{ x.klassen=x.klassen.map(c=>c===oud?nieuw:c); },`Klas ${oud} hernoemd naar ${nieuw}`); }
    catch(e){ fout++; laatste=e; }
  }
  renderAll();
  if(!fout){ toast(`Klas hernoemd naar ${nieuw}`); return; }
  console.error(laatste);
  toast(`De klas heet nu ${nieuw}, maar ${plural(fout,"uitstap heeft","uitstappen hebben")} nog de oude naam ${oud} (${laatste&&laatste.network?"geen verbinding":laatste&&laatste.rechten?"niet (meer) aangemeld":"fout bij bewaren"}).`,"err",
    {label:"Opnieuw proberen",fn:()=>hernoemInUitstappen(oud,nieuw)});
}

/* ============================================================
   OPSTARTEN
   ============================================================ */
async function boot(){
  D.failed=false; renderAll(); setConn("busy");
  await initAuth();
  try{ await loadAll(); }
  catch(e){ console.error(e); D.failed=true; setConn("off"); renderAll(); toast("De gegevens konden niet geladen worden. Controleer je verbinding.","err"); return; }
  if(!lsGet(LS_SEEN)) lsSet(LS_SEEN, window.__SEEN_DEFAULT || new Date().toISOString());
  renderAll();
}
hydrateIcons();
boot();

</script>
