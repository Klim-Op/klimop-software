/* Bewaart met controle op de versie. Heeft iemand anders intussen gewijzigd,
   dan voegen we samen per veld; enkel bij hetzelfde veld beslist de gebruiker. */
async function saveTrip(next,base,{log}={}){
  let t=norm(next);
  /* Elke echte wijziging aan de openbare gegevens telt (ook velden die niet in de historiek komen, zoals Smartschool of de prullenbak) */
  const pub=Object.keys(Object.assign({},base,t)).filter(k=>k[0]!=="_" && !BEHEER_FIELDS.includes(k) && JSON.stringify(base[k]??null)!==JSON.stringify(t[k]??null));
  const beh=BEHEER_FIELDS.filter(f=>JSON.stringify(base[f]??null)!==JSON.stringify(t[f]??null));
  if(log) t.log=[...(t.log||[]),{op:new Date().toISOString(),tekst:log}].slice(-40);
  let saved=base;
  if(pub.length || log) saved = await savePublic(t,base);
  if(beh.length){
    try{ await beheerPatch(t.id,Object.fromEntries(beh.map(f=>[f,t[f]]))); saved=replaceTrip(null,saved.id); }
    catch(e){
      if(saved===base) throw e;
      /* De openbare gegevens staan al in de database: meld precies wat wel en niet lukte */
      const x=new DbError(`De uitstap is bewaard, maar de interne gegevens (interne notitie, afstand of opmerking voor de busmaatschappij) niet${e.rechten?": je bent niet (meer) aangemeld als beheerder":e.network?": geen verbinding":""}. Klik opnieuw op Opslaan om ze nog te bewaren.`,{partial:true,rechten:e.rechten,network:e.network});
      x.saved=saved; throw x;
    }
  }
  return saved;
}
async function savePublic(t,base){
  try{
    const row=await guarded(()=>API.updateTrip(storable(t),schooljaarVan(t.datumStart),base._upd));
    return replaceTrip(row);
  }catch(e){
    if(!e.conflict) throw e;
    const cur=await guarded(()=>API.getTrip(base.id));
    if(!cur) throw new DbError("Deze uitstap bestaat niet meer.");
    const theirs=mergeBeheer(norm(cur.trip)), mine=diffData(norm(base),t), their=diffData(norm(base),theirs);
    const clash=mine.filter(f=>their.includes(f)&&JSON.stringify(t[f])!==JSON.stringify(theirs[f]));
    let keepMine=true;
    if(clash.length){
      keepMine = await confirmDialog({title:"Iemand anders wijzigde deze uitstap intussen",
        html:`<p>Terwijl jij bewerkte, werd dezelfde uitstap ook elders aangepast. Voor deze gegevens verschillen jullie versies:</p>
        <div class="diff"><span class="dh">Gegeven</span><span class="dh">Andere versie</span><span class="dh">Jouw versie</span>
        ${clash.map(f=>`<span class="dk">${esc(FIELD_LBL[f]||f)}</span><span>${esc(showVal(f,theirs[f]))}</span><span class="new">${esc(showVal(f,t[f]))}</span>`).join("")}</div>
        <p class="hint">Andere wijzigingen worden gewoon samengevoegd.</p>`,
        ok:"Mijn versie bewaren",cancel:"Andere versie behouden"});
    }
    const merged=Object.assign({},theirs);
    mine.forEach(f=>{ if(!clash.includes(f)||keepMine) merged[f]=t[f]; });
    merged.log=[...(theirs.log||[]),...(t.log||[]).filter(l=>!(theirs.log||[]).some(x=>x.op===l.op))].slice(-40);
    const row=await guarded(()=>API.updateTrip(storable(norm(merged)),schooljaarVan(merged.datumStart),cur.updated_at));
    toast(clash.length?"Bewaard":"Bewaard en samengevoegd met een wijziging van iemand anders","ok");
    return replaceTrip(row);
  }
}

async function beheerPatch(id,patch){
  for(let poging=0;poging<3;poging++){
    const cur=D.beheer[id], data=Object.assign({},cur?cur.data:{},patch);
    try{
      const row=await guarded(()=>API.saveBeheer(id,data,cur?cur._upd:null));
      D.beheer[id]={data:row.data||{},_upd:row.updated_at}; markWrite(); D.sig=dataSig(); return true;
    }catch(e){
      if(!e.conflict) throw e;
      const fresh=await guarded(()=>API.getBeheer(id));
      if(fresh) D.beheer[id]={data:fresh.data||{},_upd:fresh.updated_at}; else delete D.beheer[id];
    }
  }
  throw new DbError("De beheergegevens werden tegelijk elders gewijzigd. Probeer opnieuw.");
}
function replaceTrip(row,idOnly){
  const cur=idOnly?tripById(idOnly):null;
  const nt=row?fromRow(row):mergeBeheer(Object.assign({},cur)), i=D.trips.findIndex(x=>x.id===nt.id), j=D.arch.findIndex(x=>x.id===nt.id);
  if(i>=0) D.trips[i]=nt; else if(j>=0) D.arch[j]=nt; else D.trips.push(nt);
  markWrite(); D.sig=dataSig(); return nt;
}
/* Kleine, directe wijziging (statustegel, vinkje) */
async function patchTrip(id,fn,logTxt){
  const base=tripById(id); if(!base) return null;
  const next=clone(base); fn(next);
  return saveTrip(next,base,{log:logTxt});
}

/* ---------- Wijzigingsaanvragen ---------- */
async function insertReq(a){
  const row=await guarded(()=>API.insertReq(a)); markWrite();
  const n=fromReq(row), i=D.reqs.findIndex(x=>x.id===n.id); if(i>=0) D.reqs[i]=n; else D.reqs.push(n); D.sig=dataSig(); return n;
}
/* Bewaart met de versie van het object dat je voor je had (niet die van een latere verversing):
   heeft iemand anders de aanvraag intussen behandeld, dan wordt die beslissing niet overschreven. */
async function updateReq(a){
  const upd = a._upd ?? (D.reqs.find(x=>x.id===a.id)||{})._upd;
  try{
    const row=await guarded(()=>API.updateReq(Object.fromEntries(Object.entries(a).filter(([k])=>k[0]!=="_")),upd));
    markWrite(); const n=fromReq(row), i=D.reqs.findIndex(x=>x.id===n.id); if(i>=0) D.reqs[i]=n; else D.reqs.push(n); D.sig=dataSig(); return n;
  }catch(e){
    if(!e.conflict) throw e;
    const cur=await guarded(()=>API.getReq(a.id)).catch(()=>null);
    if(cur){ const n=fromReq(cur), i=D.reqs.findIndex(x=>x.id===n.id); if(i>=0) D.reqs[i]=n; else D.reqs.push(n); D.sig=dataSig(); }
    const st=cur&&cur.data&&cur.data.status;
    if(st && st!=="open"){ const x=new DbError(`Deze aanvraag werd intussen al ${st==="verwerkt"?"verwerkt":"afgewezen"} door iemand anders. Er werd niets overschreven.`,{conflict:true}); x.afgehandeld=true; throw x; }
    throw new DbError("Deze aanvraag werd intussen gewijzigd. Open ze opnieuw en probeer nog eens.",{conflict:true});
  }
}

/* ---------- Instellingen: wijziging als functie, zodat ze na een conflict opnieuw toegepast kan worden ---------- */
async function mutateSettings(fn){
  for(let poging=0;poging<3;poging++){
    const next=normSettings(clone(S())); fn(next);
    try{
      const row=await guarded(()=>API.saveSettings(next,D.setUpd));
      D.settings=normSettings(row.data); D.setUpd=row.updated_at; markWrite(); D.sig=dataSig(); return true;
    }catch(e){
      if(!e.conflict) throw e;
      const cur=await guarded(()=>API.getSettings());
      D.settings=normSettings(cur?cur.data:null); D.setUpd=cur?cur.updated_at:null;
    }
  }
  throw new DbError("De instellingen werden tegelijk elders gewijzigd. Probeer opnieuw.");
}

/* ---------- Stille verversing (elke 20 s) ----------
   De gegevens worden op de achtergrond vernieuwd; het hertekenen wacht tot je niet meer bezig bent
   (invoer, open venster, muis op een lijstrij). Open bewerkingen houden hun eigen versie bij. */
let refreshWaiting=false;
function isBusy(){
  if(ovStack.length || (typeof WPOP!=="undefined" && WPOP.open)) return true;
  const a=document.activeElement;
  if(a && a.closest && a.closest("main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  if(document.querySelector(".bl-item.up")) return true;
  return pending>0;
}
async function refresh({manual=false}={}){
  if(!manual && (document.hidden)) return;
  try{
    if(manual){ D.archYears.clear(); if(typeof AR!=="undefined") AR.years=null; }   // ook het archief opnieuw ophalen
    const changed=await loadAll();
    if(changed || manual){ if(isBusy() && !manual){ refreshWaiting=true; } else { refreshWaiting=false; renderAll(); } }
    if(manual) toast("Vernieuwd");
  }catch(e){ D.failed=true; if(manual) toast("Vernieuwen lukte niet: geen verbinding met de database.","err"); }
}
setInterval(()=>refresh(),20000);
setInterval(()=>{ if(refreshWaiting && !isBusy()){ refreshWaiting=false; renderAll(); } },1500);

/* ---------- Meldingen (met ongedaan maken) ---------- */
function toast(msg,type="ok",action){
  const w=$("toastWrap"), t=document.createElement("div");
  t.className="toast "+type;
  const s=document.createElement("span"); s.textContent=msg; t.appendChild(s);
  if(action){ const b=document.createElement("button"); b.textContent=action.label; b.onclick=()=>{ t.remove(); action.fn(); }; t.appendChild(b); }
  w.appendChild(t); while(w.children.length>3) w.firstChild.remove();
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),260); }, action?6500:(type==="err"?5200:2800));
}
/* Foutmelding volgens de echte oorzaak: gedeeltelijk bewaard, geweigerd, conflict, geen verbinding,
   een weigering van de database, of een fout in de tool zelf. */
function dbFail(e,wat){
  console.error(e);
  const w = wat ? wat+" lukte niet: " : "Niet gelukt: ";
  if(e && e.partial){ toast(e.message,"err",e.rechten?{label:"Aanmelden",fn:()=>openLogin()}:undefined); return; }
  if(e && e.rechten){ toast(w+"je bent niet (meer) aangemeld als beheerder. Je invoer blijft staan.","err",{label:"Aanmelden",fn:()=>openLogin()}); return; }
  if(e && e.conflict){ toast(e.message,"err"); return; }
  if(e && e.network){ toast(w+"geen verbinding met de database. Er is niets verloren; probeer opnieuw.","err"); return; }
  if(e instanceof DbError){ toast(w+"de database weigerde de gegevens"+(e.status?` (fout ${e.status})`:"")+". Je invoer blijft staan.","err"); return; }
  toast(w+"er liep iets mis in de tool. Je invoer blijft staan; probeer opnieuw of laad de pagina opnieuw.","err");
}

/* ---------- Vensters: focus vasthouden, Escape, stapelen ---------- */
const ovStack=[]; const onDismiss={};
function openOverlay(id,focusSel){
  const ov=$(id); if(ov.classList.contains("open")) return;
  ovStack.push({id,prev:document.activeElement});
  ov.style.zIndex=100+ovStack.length*2; ov.classList.add("open"); hideHover();
  setTimeout(()=>{ const el=(focusSel&&ov.querySelector(focusSel))||ov.querySelector(".modal-close")||ov.querySelector("button"); if(el) el.focus({preventScroll:true}); },40);
}
function closeOverlay(id){
  const ov=$(id); if(!ov.classList.contains("open")) return; ov.classList.remove("open");
  const i=ovStack.map(x=>x.id).lastIndexOf(id);
  if(i>=0){ const {prev}=ovStack.splice(i,1)[0]; if(prev && document.contains(prev) && prev.focus) prev.focus({preventScroll:true}); }
}
function dismiss(id){ (onDismiss[id]||closeOverlay)(id); }
document.querySelectorAll(".overlay").forEach(ov=>{
  ov.addEventListener("mousedown",e=>{ ov._down = e.target===ov; });
  ov.addEventListener("click",e=>{ if(e.target===ov && ov._down) dismiss(ov.id); });
});
document.addEventListener("click",e=>{ const c=e.target.closest("[data-close]"); if(c) dismiss(c.dataset.close); });
document.addEventListener("keydown",e=>{
  if(!ovStack.length) return;
  const ov=$(ovStack[ovStack.length-1].id);
  if(e.key==="Escape"){ e.preventDefault(); dismiss(ov.id); return; }
  if(e.key!=="Tab") return;
  const f=[...ov.querySelectorAll("button,input,select,textarea,a[href],[tabindex]:not([tabindex='-1'])")].filter(x=>!x.disabled && x.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});
function confirmDialog({title,html,ok="Bevestigen",cancel="Annuleren",tone="primary"}){
  return new Promise(res=>{
    $("cfTitle").textContent=title; $("cfBody").innerHTML=html;
    const okB=$("cfOk"), noB=$("cfCancel");
    okB.textContent=ok; noB.textContent=cancel; noB.hidden=!cancel;
    okB.className="btn "+(tone==="danger"?"btn-coral":"btn-primary");
    const done=v=>{ okB.onclick=null; noB.onclick=null; onDismiss.cfOverlay=null; closeOverlay("cfOverlay"); res(v); };
    okB.onclick=()=>done(true); noB.onclick=()=>done(false); onDismiss.cfOverlay=()=>done(false);
    openOverlay("cfOverlay", tone==="danger" ? "#cfCancel" : "#cfOk");
  });
}
function wipeDialog({title,html,exportFn,okLabel="Definitief verwijderen"}){

    doB.onclick=()=>{ if(cb.checked) done(true); };
    $("wipeCancel").onclick=()=>done(false); onDismiss.wipeOverlay=()=>done(false);
    openOverlay("wipeOverlay","#wipeExport");
  });
}

/* ---------- Beheerder: aanmelden met eigen account ---------- */
function openLogin(){
  $("pinText").textContent = "Meld je aan met je beheerdersaccount om gegevens te kunnen wijzigen.";
  $("pinFields").innerHTML = `<div class="login-fields">
      <div class="field"><label for="loginMail">E-mailadres</label><input class="ctrl" id="loginMail" type="email" autocomplete="username" inputmode="email"></div>
      <div class="field"><label for="pinIn">Wachtwoord</label><input class="ctrl" id="pinIn" type="password" autocomplete="current-password"></div>
      <label class="check-row login-rem"><input type="checkbox" id="loginRem"> Aangemeld blijven op deze computer</label>
      <div class="hint">Niet aanvinken op een gedeelde computer: dan word je afgemeld zodra je de browser sluit.</div></div>`;
  $("pinErr").textContent="";
  $("pinOk").disabled=false; $("pinOk").textContent="Aanmelden";
  openOverlay("pinOverlay","#loginMail");
  /* Enter afvangen: anders klikt dezelfde toetsaanslag na het sluiten ook de knop "Beheer" aan */
  $("pinFields").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); tryLogin(); } };
}
function loginFout(msg){
  $("pinErr").textContent=msg;
  const m=qs("#pinOverlay .modal"); m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake");
}
let loginBusy=false;
async function tryLogin(){
  if(loginBusy) return;
  const mail=($("loginMail").value||"").trim(), pw=$("pinIn").value||"", rem=$("loginRem").checked;
  if(!mail||!pw){ loginFout("Vul je e-mailadres en wachtwoord in."); (mail?$("pinIn"):$("loginMail")).focus(); return; }
  loginBusy=true; const b=$("pinOk"); b.disabled=true; b.innerHTML=`<span class="spin"></span>Bezig…`; $("pinErr").textContent="";
  try{
    await AUTH.signIn(mail,pw,rem);
    const ok=await API.isBeheerder();
    if(!ok){ await AUTH.signOut(); loginFout("Dit account heeft geen beheerrechten voor de uitstappentool."); return; }
    isAdmin=true; authGen++; closeOverlay("pinOverlay");
    try{ await loadAll(); }catch(e){}
    renderAll(); toast("Aangemeld als beheerder");
  }catch(e){
    const m=String(e&&e.message||"");
    loginFout(/invalid login|invalid_credentials|invalid grant/i.test(m) ? "E-mailadres of wachtwoord klopt niet."
      : /fetch|network|verbinding/i.test(m) ? "Geen verbinding. Controleer je internet en probeer opnieuw."
      : m || "Aanmelden lukte niet.");
    $("pinIn").value=""; $("pinIn").focus();
  }finally{ loginBusy=false; b.disabled=false; b.textContent="Aanmelden"; }
}
/* Eén plek die bij afmelden (knop of verlopen sessie) alle beheergegevens opruimt:
   in het geheugen (uitstappen, archief, bewerkmodel) én op het scherm (bewerkvenster, beheervensters, instellingen, afdruk). */
function wisBeheerToestand(){
  isAdmin=false; authGen++;
  D.beheer={}; D.trips.forEach(mergeBeheer); D.arch.forEach(mergeBeheer);
  ED.M=null; ED.base=null; ED.reqId=null; ED.req=null; detailBack=null;

  $("view-instellingen").innerHTML=""; $("printArea").innerHTML=""; hideHover();
  if(ui.view==="instellingen") ui.view="overzicht";
}

  await AUTH.signOut();
  wisBeheerToestand(); renderAll(); toast("Afgemeld");
}
/* Bij het opstarten: bestaande sessie? Dan nagaan of dit account beheerder is. */
async function initAuth(){
  try{ if(await AUTH.token()) isAdmin = await API.isBeheerder(); }catch(e){ isAdmin=false; }
  AUTH.onChange(ev=>{
    if(ev==="SIGNED_OUT" && isAdmin){ wisBeheerToestand(); renderAll();

/* ---------- Downloaden ---------- */
function downloadBlob(name,blob){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800);
}
function download(name,content,type){ downloadBlob(name,new Blob([content],{type})); }
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(x){} ta.remove(); return ok; }
}

    <select class="ctrl${E[f]?" invalid":""}" id="${px}_${f}" data-m="${f}">${opts.map(([v,l])=>`<option value="${esc(v)}"${String(M[f]??"")===v?" selected":""}>${esc(l)}</option>`).join("")}</select>${fErr(E,f,px)}</div>`;
}
/* Statustegel: klikken wisselt naar de volgende status; elke status heeft een eigen kleur */
const TILE = {
  fact:   {states:["teontvangen","ontvangen","nvt"], l:{teontvangen:"Te ontvangen",ontvangen:"Ontvangen",nvt:"Niet van toepassing"}, c:{teontvangen:"amber",ontvangen:"green",nvt:"grey"}},
  factBus:{states:["teontvangen","ontvangen"],       l:{teontvangen:"Te ontvangen",ontvangen:"Ontvangen"},                        c:{teontvangen:"amber",ontvangen:"green"}},
  bus:    {states:["teregelen","offertes","bevestigd"], l:{teregelen:"Nog te regelen",offertes:"Offertes opgevraagd",bevestigd:"Geboekt"}, c:{teregelen:"coral",offertes:"teal",bevestigd:"green"}}
};
const nextState = (kind,v) => { const s=TILE[kind].states, i=s.indexOf(v); return s[(i+1)%s.length]; };
function tile(kind,f,v,label,{attr="data-cycle",locked=false,lockTxt=""}={}){
  const T=TILE[kind], val=T.states.includes(v)?v:(locked?v:T.states[0]);
  const txt=T.l[val]||"Niet van toepassing", col=T.c[val]||"grey";
  const nx=locked?"":T.l[nextState(kind,val)];
  return `<button type="button" class="stile s-${col}${locked?" locked":""}" ${attr}="${f}" data-kind="${kind}"${locked?" disabled":""}
    aria-label="${esc(label)}: ${esc(txt)}${locked?"":". Klik om te wijzigen naar "+esc(nx)}">
    <span class="st-l">${esc(label)}</span><span class="st-v"><span class="pt"></span>${esc(txt)}</span>
    <span class="st-n">${locked?esc(lockTxt):"klik: "+esc(nx.toLowerCase())}</span></button>`;
}
function klasTiles(M,E,px){
  const kl=S().klassen, sel=new Set(M.klassen);
  const groups=GROEPEN.map(g=>({g,items:kl.filter(k=>k.groep===g && (k.actief||sel.has(k.naam)))})).filter(x=>x.items.length);
  const known=new Set(kl.map(k=>k.naam)), extra=M.klassen.filter(k=>!known.has(k));
  if(extra.length) groups.push({g:"Niet meer in de klassenlijst",items:extra.map(n=>({naam:n,actief:false}))});
  return `<div class="field span12" data-f="klassen"><span class="flabel" id="${px}_l_klassen">Klas(sen) <span class="req">*</span></span>
    <div class="klas-groups${E.klassen?" invalid":""}" role="group" aria-labelledby="${px}_l_klassen">
    ${groups.map(({g,items})=>`<div><div class="klas-grp-h">${esc(g)}</div><div class="klas-grid">
      ${items.map(k=>`<button type="button" class="klas-tile${sel.has(k.naam)?" is-sel":""}${k.actief?"":" inactief"}" data-klas="${esc(k.naam)}" aria-pressed="${sel.has(k.naam)}">${esc(k.naam)}</button>`).join("")}
    </div></div>`).join("")}</div>${fErr(E,"klassen",px)}
    <div class="klas-count" data-live="klascount">${klasCountTxt(M)}</div></div>`;
}
function klasCountTxt(M){ const n=M.klassen.length; return n ? `${plural(n,"klas","klassen")} gekozen: ${esc(sortKlassen(M.klassen).join(", "))}` : "Nog geen klas gekozen."; }
function sortKlassen(a){ const o=S().klassen.map(k=>k.naam); return [...(a||[])].sort((x,y)=>{ const i=o.indexOf(x),j=o.indexOf(y); return (i<0?999:i)-(j<0?999:j)||x.localeCompare(y); }); }

/* ---------- Waarschuwingen (blokkeren nooit) ---------- */
function annForRange(s,e){
  const out=[]; if(!parseISO(s)) return out; const set=S();
  const end=parseISO(e)?e:s; let d=s, guard=0;
  while(d<=end && guard++<40){
    set.vakanties.forEach(v=>{ if(d>=v.van&&d<=v.tot&&!out.find(x=>x.naam===v.naam)) out.push({soort:"vakantie",naam:v.naam}); });
    set.vrijedagen.forEach(v=>{ if(d===v.datum&&!out.find(x=>x.naam===v.naam)) out.push({soort:"vrije dag",naam:v.naam}); });
    set.meldingen.forEach(m=>{ const me=m.datumEind||m.datum; if(d>=m.datum&&d<=me&&!out.find(x=>x.naam===m.naam)) out.push({soort:"melding",naam:m.naam}); });
    d=addDays(d,1);
  }
  return out;
}
function dubbeleKlassen(M,skipId){
  if(!parseISO(M.datumStart)||!M.klassen.length) return [];
  const s=M.datumStart, e=(M.type==="meerdaags"&&parseISO(M.datumEind))?M.datumEind:s;
  return liveTrips().filter(t=>t.id!==skipId && !isCancel(t) && t.datumStart<=e && tripEnd(t)>=s && t.klassen.some(k=>M.klassen.includes(k)))
    .map(t=>({t,kl:t.klassen.filter(k=>M.klassen.includes(k))}));
}
function perLlnOf(M){
  if(M.prijsStatus!=="bekend") return null;
  const n=parseEuro(M.kostIn), l=intOr(M.aantalLln,0); if(n==null||isNaN(n)||!n) return null;
  if(M.kostprijsBasis==="perLln") return {per:n,tot:l?r2(n*l):null,n,l};
  return l ? {per:r2(n/l),tot:n,n,l} : null;
}
/* Lijst van waarschuwingen, elk met een vaste sleutel en een plaats in het formulier */
function warnList(M,skipId){
  const out=[], add=(id,slot,html)=>out.push({id,slot,html});
  const ok=parseISO(M.datumStart) && M.datumStart>="2000-01-01";
  if(ok){
    const e=(M.type==="meerdaags"&&parseISO(M.datumEind))?M.datumEind:M.datumStart, dag=M.type==="meerdaags"?"deze periode":"deze dag";
    annForRange(M.datumStart,e).forEach(a=>{
      if(a.soort==="vakantie") add("d:"+a.naam,"datum",`${cap(dag)} valt in de <b>${esc(a.naam)}</b>. Klopt de datum?`);
      else if(a.soort==="vrije dag") add("d:"+a.naam,"datum",`<b>${esc(a.naam)}</b>: dit is een vrije dag. Klopt de datum?`);
      else add("d:"+a.naam,"datum",`Op ${dag} staat al iets gepland: <b>${esc(a.naam)}</b>.`);
    });
    const wd=dow(M.datumStart); if(M.type==="dag" && (wd===0||wd===6)) add("weekend","datum",`<b>Dit is een ${DAGEN[wd]}.</b> Klopt de datum?`);
    if(M.datumStart<todayISO()) add("verleden","datum",`<b>Deze datum ligt in het verleden.</b> Geef je een uitstap achteraf in? Dan is dat in orde.`);
    else if(M.vervoer==="bus" && daysBetween(todayISO(),M.datumStart)<14) add("bus14","verv",`<b>Minder dan twee weken op voorhand.</b> Een bus is dan niet altijd nog beschikbaar. Verwittig ook even de administratie.`);
  }
  dubbeleKlassen(M,skipId).forEach(({t,kl})=>add("k:"+t.id+":"+kl.join(","),"klas",
    `<b>${esc(kl.join(", "))}</b> ${kl.length===1?"heeft":"hebben"} ${t.type==="meerdaags"||t.datumStart!==M.datumStart?"in die periode":"die dag"} al een uitstap: <b>${esc(t.activiteit)}</b> (${esc(fmtD(t.datumStart))}, aangevraagd door ${esc(t.leerkracht||"onbekend")}). Is het dezelfde uitstap? Dan hoef je ze niet opnieuw in te geven.`));
  const p=perLlnOf(M);
  if(p && p.per>=40) add("prijs:hoog","prijs",`Dat is <b>${esc(euro(p.per))} per leerling</b>${p.tot!=null?` (${esc(euro(p.tot))} voor ${p.l} leerlingen)`:""}. Klopt dat? Kijk na of je <b>Totaal voor de groep</b> of <b>Per leerling</b> hebt aangeduid.`);
  else if(p && M.kostprijsBasis==="totaal" && p.l>=5 && p.per<1) add("prijs:laag","prijs",`Dat is maar <b>${esc(euro(p.per))} per leerling</b>. Is ${esc(euro(p.n))} misschien de prijs per leerling? Duid dan <b>Per leerling</b> aan.`);
  if(M.betaalKeuze && M.betaalKeuze!=="Factuur (voorkeur)" && M.prijsStatus && M.prijsStatus!=="gratis") add("betaal","betaal",`<b>Niet op factuur?</b> Betalen op factuur heeft altijd de voorkeur. Vraag bij de organisatie na of dat kan.`);
  return out;
}

function vorigeKeer(M){
  const q=fold(M.activiteit).trim(); if(q.length<3) return null;
  const hits=D.trips.filter(t=>fold(t.activiteit).trim()===q && (t.stad||t.straat||t.contactTel)).sort((a,b)=>b.datumStart.localeCompare(a.datumStart));
  const h=hits[0]; if(!h) return null;

/* In deelpanelen: labels in dezelfde rij even hoog maken, zodat de invulvelden op één lijn staan */
function alignLabels(root){
  qsa(".vpanel .grid",root).forEach(g=>{
    if(!g.offsetParent) return;
    const labs=qsa(":scope > .field > label, :scope > .field > .flabel",g);
    labs.forEach(l=>l.style.paddingTop="");
    const rows=new Map();
    labs.forEach(l=>{ const top=l.parentNode.offsetTop; if(!rows.has(top)) rows.set(top,[]); rows.get(top).push(l); });
    rows.forEach(ls=>{ if(ls.length<2) return; const hs=ls.map(l=>l.getBoundingClientRect().height), h=Math.max(...hs); ls.forEach((l,i)=>{ const d=h-hs[i]; if(d>0.5) l.style.paddingTop=d.toFixed(2)+"px"; }); });
  });
}

function focusFirstError(host,E){

/* ============================================================
   OPVALLENDE WAARSCHUWING
   Verschijnt bovenaan met een wazige achtergrond. Na "OK" schuift ze
   vloeiend naar haar plaats in het formulier.
   ============================================================ */
const WPOP={timer:null,open:false};
function scheduleWarnPopup(ms=650){ clearTimeout(WPOP.timer); WPOP.timer=setTimeout(showWarnPopup,ms); }
function showWarnPopup(){
  if(WPOP.open || ui.view!=="nieuw" || !NF.M || NF.confirmId || ovStack.length || NF.busy) return;
  const items=warnList(NF.M).filter(w=>!NF.ack.includes(w.id)); if(!items.length) return;
  WPOP.open=true;
  const prev=document.activeElement;
  const el=document.createElement("div"); el.className="wpop";
  el.innerHTML=`<div class="wpop-box" role="alertdialog" aria-modal="true" aria-labelledby="wpopT" aria-describedby="wpopC">
    <div class="wpop-t" id="wpopT">${ic("alert",18)}Even opletten</div>
    <div class="wpop-cards" id="wpopC">${items.map(w=>`<div class="fwarn" data-wid="${esc(w.id)}">${ic("alert",16)}<div>${w.html}</div></div>`).join("")}</div>
    <div class="wpop-f"><button class="btn btn-primary" id="wpopOk">OK, begrepen</button></div></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("in")));
  const ok=el.querySelector("#wpopOk"); setTimeout(()=>ok.focus({preventScroll:true}),40);
  el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key==="Escape"||e.key===" "){ e.preventDefault(); done(); } else if(e.key==="Tab"){ e.preventDefault(); ok.focus(); } });
  ok.onclick=done;
  function done(){
    if(el._done) return; el._done=true;
    items.forEach(w=>{ if(!NF.ack.includes(w.id)) NF.ack.push(w.id); }); saveConcept();
    const targets=items.map(w=>qs(`#nfForm .fwarn[data-wid="${CSS.escape(w.id)}"]`));
    targets.forEach(t=>{ if(t){ t.classList.remove("pending"); t.classList.add("landing"); } });
    const first=targets.find(Boolean);
    if(first){ const r=first.getBoundingClientRect(); if(r.top<90||r.bottom>innerHeight-30) window.scrollTo(0,window.scrollY+r.top-innerHeight*0.4); }
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, flyers=[];
    if(!reduce) qsa(".wpop-cards .fwarn",el).forEach((c,i)=>{
      const t=targets[i]; if(!t) return; const r1=c.getBoundingClientRect(), r2=t.getBoundingClientRect();
      const f=c.cloneNode(true); f.classList.add("flyer"); Object.assign(f.style,{left:r1.left+"px",top:r1.top+"px",width:r1.width+"px"}); document.body.appendChild(f); flyers.push([f,r2]); });
    el.classList.add("out"); el.classList.remove("in");
    requestAnimationFrame(()=>requestAnimationFrame(()=>flyers.forEach(([f,r2])=>{ f.classList.add("go"); Object.assign(f.style,{left:r2.left+"px",top:r2.top+"px",width:r2.width+"px"}); })));
    setTimeout(()=>{ flyers.forEach(([f])=>f.remove()); targets.forEach(t=>t&&t.classList.remove("landing")); el.remove(); WPOP.open=false;
      if(prev && document.contains(prev) && prev!==document.body) prev.focus({preventScroll:true}); scheduleWarnPopup(300); }, reduce?0:560);
  }
}

function seenTs(){ return lsGet(LS_SEEN) || ""; }
function issues(t){
  const out=[], c=isCancel(t), past=isPast(t);
  if(t._datumFout) out.push({k:"onvolledig",l:"Datum ongeldig",c:"warn"});   // eerst: dit moet als eerste rechtgezet worden
  if(D.reqs.some(a=>a.uitstapId===t.id&&a.status==="open")) out.push({k:"aanvragen",l:"Wijziging aangevraagd",c:"open"});
  if(t.busNodig && t.busStatus==="teregelen" && !c && !past) out.push({k:"bus",l:"Offertes op te vragen",c:"open"});
  if(t.busNodig && t.busStatus==="offertes" && !c && !past) out.push({k:"boeken",l:"Bus nog te boeken",c:"info"});
  if(!c && t.prijsStatus!=="gratis" && (!t.internBestelbonUitstap || (t.busNodig && !t.internBestelbonBus))) out.push({k:"bon",l:"Bestelbon ontbreekt",c:"muted"});
  const kosten0 = t.annulering && t.annulering.kosten>0;
  if((!c||kosten0) && past && (t.factuurStatus==="teontvangen"||t.factuurStatusBus==="teontvangen")) out.push({k:"factuur",l:"Factuur te ontvangen",c:"open"});
  if(t.voorschot && !t.voorschotBetaaldOp && !c) out.push({k:"voorschot",l:"Voorschot te betalen",c:"open"});
  if(!t._datumFout && !c && !past && (t.prijsStatus==="tebevestigen" || (t.busNodig && (!bestemmingStad(t)||!t.vertrekSchool||!t.terug)))) out.push({k:"onvolledig",l:"Gegevens onvolledig",c:"muted"});
  const ch=ssChanged(t);
  if(ch.length) out.push({k:"smartschool",l:"Opnieuw naar Smartschool",c:"warn"});
  else if(!(t.smartschool&&t.smartschool.op) && !c && !past) out.push({k:"smartschool",l:"Nog niet in Smartschool",c:"muted"});
  return out;
}
/* Werkfilters met een kleur per soort: koraal = dringend, amber = opvolgen, teal/groen = ter info */
const WERK = [
  ["nieuw","Nieuw","teal"],["aanvragen","Wijzigingsaanvragen","coral"],["bevestigen","Nog te bevestigen","amber"],["bus","Offertes op te vragen","coral"],["boeken","Bus nog te boeken","amber"],["bon","Bestelbon ontbreekt","amber"],["factuur","Factuur te ontvangen","amber"],
  ["voorschot","Voorschot","amber"],["onvolledig","Onvolledig","amber"],["smartschool","Smartschool","teal"],["weken","Komende 2 weken","green"]

const VERV_OPT = [["","Alle vervoer"],["bus","Met bus"],["openbaar","Openbaar vervoer"],["actief","Te voet of met de fiets"],["school","Op school"]];
function werkMatch(t,k){
  if(k==="nieuw") return !!t.ingevoerdOp && t.ingevoerdOp>seenTs();
  /* Nog te bevestigen: status "Ontvangen", niet geannuleerd, vanaf het begin van dit schooljaar */
  if(k==="bevestigen") return !isCancel(t) && t.planStatus==="aangevraagd" && tripEnd(t)>=sjRange(huidigSJ())[0];
  if(k==="weken") return !isCancel(t) && t.datumStart>=todayISO() && t.datumStart<=addDays(todayISO(),14);
  return issues(t).some(i=>i.k===k);
}
function searchHay(t){

    t.adminNotitie,t.opmerking,t.betaalwijze,t.openbaarVervoerder,"#"+t._nr,amountForms(k.act),amountForms(k.per),
    isAdmin?t.interneNotitie:"",isAdmin?t.busReferentie:"",fmtLong(t.datumStart)].join(" \u0001 ");

function periodOk(t){
  if(ui.periode==="komend") return tripEnd(t)>=todayISO();

/* Basis: klas en zoekterm. Een werkfilter (beheer) geldt over alle datums; anders telt de periode. */
function baseTrips(){ const ts=terms(ui.q); return liveTrips().filter(t=>(!ui.klas||t.klassen.includes(ui.klas)) && (!ui.verv||vervoer(t)===ui.verv) && matchAll(ts,searchHay(t))); }
function visibleTrips(){
  let rows=baseTrips();
  rows = (isAdmin && ui.werk) ? rows.filter(t=>werkMatch(t,ui.werk)) : rows.filter(periodOk);
  const dir=ui.sort.dir, key=ui.sort.key, ko=S().klassen.map(k=>k.naam);
  const kidx=t=>Math.min(999,...t.klassen.map(k=>{ const i=ko.indexOf(k); return i<0?998:i; }));
  rows=rows.slice().sort((a,b)=>{
    let c=0;
    if(key==="activiteit") c=a.activiteit.localeCompare(b.activiteit,"nl");

  list.addEventListener("pointerover",e=>{ const it=e.target.closest(".bl-item"); if(!it||it.classList.contains("up")) return; it.classList.remove("down"); it.classList.add("up"); });
  list.addEventListener("pointerout",e=>{ const it=e.target.closest(".bl-item"); if(!it||it.contains(e.relatedTarget)) return;
    it.classList.remove("up"); it.classList.add("down"); clearTimeout(it._t); it._t=setTimeout(()=>{ if(!it.classList.contains("up")) it.classList.remove("down"); },340); });
}

/* ---------- CSV (Belgische notatie; veilig voor Excel) ---------- */
function csvCell(v){
  let s=String(v??"");
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
  return `"${s.replace(/"/g,'""')}"`;
}
const cNum = n => (n==null||isNaN(n)) ? "" : NF2.format(n);
function telTxt(v){ const s=String(v||"").trim(); if(!s||/\s/.test(s)) return s; const d=s.replace(/\D/g,""); if(d.length===10) return d.replace(/(\d{4})(\d{2})(\d{2})(\d{2})/,"$1 $2 $3 $4"); if(d.length===9) return /^0[2349]/.test(d) ? d.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/,"$1 $2 $3 $4") : d.replace(/(\d{3})(\d{2})(\d{2})(\d{2})/,"$1 $2 $3 $4"); return s; }
function exportCSV(list,soort,naam){

    ...(isAdmin?["Interne notitie"]:[]),"Annulering","Ingediend op"];
  const rows=list.map(t=>{ const k=kosten(t); return [t._nr,schooljaarVan(t.datumStart),fmtNum(t.datumStart),fmtNum(t.datumEind),t.type==="meerdaags"?"meerdaags":"dag",t.activiteit,
    (PLAN_ST[t.planStatus]||[""])[0],sortKlassen(t.klassen).join(" "),t.aantalLln,t.aantalBegeleiders||"",t.leerkracht,t.straat,t.nummer,t.postcode,t.stad,
    telTxt(t.contactTel),t.contactEmail,t.locatieAnders?locAdres(t):"",t.vertrekSchool,t.terug,t.terugSchool,vervoerTxt(t),t.busNodig?(BUS_ST[t.busStatus]||[""])[0]:"",t.busmaatschappij,t.busReferentie,
    t.busNodig?cNum(t.prijsVervoer):"",t.internBestelbonBus,t.busNodig?(FACT_ST[t.factuurStatusBus]||[""])[0]:"",vervoer(t)==="openbaar"?cNum(kosten(t).verv):"",PRIJS_ST[t.prijsStatus]||"",cNum(k.act),cNum(k.per),
    t.betaalwijze,t.voorschot?cNum(t.voorschotBedrag):"",t.voorschot?(t.voorschotInclusief==="incl"?"inclusief":t.voorschotInclusief==="excl"?"exclusief":""):"",fmtNum(t.voorschotVervalt),fmtNum(t.voorschotBetaaldOp),
    t.internBestelbonUitstap,(FACT_ST[t.factuurStatus]||[""])[0],t.smartschool&&t.smartschool.op?("overgenomen "+fmtNum(t.smartschool.op.slice(0,10))+(ssChanged(t).length?" (daarna gewijzigd)":"")):"",

  const csv="\ufeff"+[cols,...rows].map(r=>r.map(csvCell).join(";")).join("\r\n");

function costBlock(t,k){

  let h=`<div class="cost-tbl">`;
  if(t.prijsStatus==="gratis") h+=L("Uitstap","gratis");
  else if(t.prijsStatus==="tebevestigen") h+=L("Uitstap","nog te bevestigen");
  else { h+=L(t.voorschot&&t.voorschotInclusief==="excl"?"Uitstap (zonder voorschot)":"Uitstap",esc(euro(k.act)));
    if(k.per!=null) h+=L(t.kostprijsBasis==="perLln"?"Prijsbasis: per leerling":"Per leerling",`${esc(euro(k.per))} × ${t.aantalLln}`,"sub");
    if(t.voorschot && t.voorschotInclusief==="excl") h+=L("Voorschot",esc(euro(k.vs))); }
  if(k.verv!=null) h+=L(t.busNodig?"Bus":"Openbaar vervoer",esc(euro(k.verv)));
  if(k.tot!=null && (k.verv!=null || (t.voorschot&&t.voorschotInclusief==="excl"))) h+=L("Totaal",esc(euro(k.tot)),"tot")+(k.perAll!=null?L("Totaal per leerling",esc(euro(k.perAll)),"sub"):"");
  else if(!k.volledig && (k.verv!=null || (t.busNodig||t.vervoerwijze==="openbaar"))) h+=L("Totaal","volgt zodra alle prijzen gekend zijn","tot");
  if(t.betaalwijze) h+=L("Betaling",esc(t.betaalwijze),"sub");
  if(t.voorschot){
    h+=`<div class="cl" style="margin-top:6px"><span><b>Voorschot</b></span><span><b>${esc(euro(t.voorschotBedrag))}</b></span></div>`;

async function detailClick(e,id){
  const t=tripById(id); if(!t) return;
  let el;
  if((el=e.target.closest("[data-qt]")) && !el.disabled){
    const f=el.dataset.qt, nv=nextState(el.dataset.kind,t[f]);
    el.disabled=true;
    try{ await patchTrip(id,x=>{ x[f]=nv; if(f==="busStatus"&&nv==="bevestigd"&&!x.busBevestigdOp) x.busBevestigdOp=todayISO(); },`${FIELD_LBL[f]}: ${showVal(f,nv)}`); renderAll(); toast(`${FIELD_LBL[f]}: ${showVal(f,nv).toLowerCase()}`); }
    catch(err){ dbFail(err,"Bewaren"); el.disabled=false; }
    return;
  }
  if((el=e.target.closest("[data-rq]"))){ const a=D.reqs.find(x=>x.id===el.dataset.id); if(el.dataset.rq==="doe") processReq(t,a); else rejectReq(t,a); return; }
  el=e.target.closest("[data-d]"); if(!el) return;
  const d=el.dataset.d;
  if(d==="fiche") printFiche(t);
  else if(d==="ics") downloadIcs(t);
  else if(d==="kopie") copyToForm(t,"herhaal");
  else if(d==="req") openReqForm(t);
  else if(d==="edit") startEdit(t);
  else if(d==="editfact") startEdit(t,null,null,"fact");
  else if(d==="busmail") busMail(t);
  else if(d==="sstxt"){ const ok=await copyText(ssText(t)); toast(ok?"Tekst voor Smartschool gekopieerd":"Kopiëren lukte niet", ok?"ok":"err"); }
  else if(d==="ss") toggleSS(t);
  else if(d==="vsbetaald"){ try{ await patchTrip(id,x=>{ x.voorschotBetaaldOp=todayISO(); },"Voorschot betaald"); renderAll(); toast("Voorschot als betaald aangeduid"); }catch(err){ dbFail(err,"Bewaren"); } }
  else if(d==="del") softDelete(t);
}
async function toggleSS(t){
  const ss=t.smartschool&&t.smartschool.op, ch=ssChanged(t);
  let next, msg;
  if(!ss || ch.length){ next={op:new Date().toISOString(),snap:ssSnap(t)}; msg="Aangeduid als overgenomen in Smartschool"; }
  else { next=null; msg="Overname in Smartschool ongedaan gemaakt"; }
  try{ await patchTrip(t.id,x=>{ x.smartschool=next; },next?"Overgenomen in Smartschool":"Overname in Smartschool ongedaan"); renderAll(); toast(msg); }
  catch(e){ dbFail(e,"Bewaren"); }
}
function ssText(t){
  const k=kosten(t);
  const wanneer = t.type==="meerdaags" ? `van ${fmtLong(t.datumStart)} tot en met ${fmtLong(t.datumEind)}` : `op ${fmtLong(t.datumStart)}`;
  const lines=[`${t.activiteit}${bestemmingStad(t)?" ("+bestemmingStad(t)+")":""}`,`Klassen: ${sortKlassen(t.klassen).join(", ")}`,`Wanneer: ${wanneer}`];
  if(t.vertrekSchool) lines.push(`Vertrek aan school: ${fmtTime(t.vertrekSchool)}`);
  if(t.terugSchool) lines.push(`Terug op school: ongeveer ${fmtTime(t.terugSchool)}`);
  if(vervoer(t)==="bus") lines.push("Vervoer: met de bus"); else if(vervoer(t)==="openbaar") lines.push(`Vervoer: met ${t.openbaarVervoerder||"het openbaar vervoer"}`); else if(vervoer(t)==="actief") lines.push("Vervoer: te voet of met de fiets");
  /* Enkel een totaalprijs als alles gekend is; een gedeeltelijke prijs zo benoemen */
  if(t.prijsStatus==="tebevestigen") lines.push("Kostprijs: nog te bevestigen");
  else if(k.volledig) lines.push(!k.tot ? "Kostprijs: gratis" : k.perAll!=null ? `Kostprijs: ${euro(k.perAll)} per leerling` : `Kostprijs: ${euro(k.tot)}`);
  else lines.push(t.prijsStatus==="gratis" ? "Kostprijs: de activiteit is gratis; de kostprijs van het vervoer volgt"
    : `Kostprijs: ${k.per!=null?euro(k.per)+" per leerling":euro(k.act)} voor de activiteit; de kostprijs van het vervoer volgt`);
  if(isCancel(t)) lines.unshift("GEANNULEERD");
  return lines.join("\n");
}
async function softDelete(t){

    toast("Uitstap verwijderd","ok",{label:"Ongedaan maken",fn:async()=>{ try{ await patchTrip(t.id,x=>{ x.verwijderdOp=null; },"Teruggezet uit de prullenbak"); renderAll(); toast("Teruggezet"); }catch(e){ dbFail(e,"Terugzetten"); } }});
  }catch(e){ dbFail(e,"Verwijderen"); }

const ED_TABS=[["alg","Algemeen"],["best","Bestemming & uren"],["fact","Vervoer & facturatie"]];
function startEdit(t,prefill,reqId,tab){
  ED.base=clone(t); ED.M=toModel(t); ED.state={E:{}}; ED.reqId=reqId||null; ED.hl=[];
  /* De aanvraag zoals ze was toen je ze opende (met haar versie): zo wordt een intussen genomen beslissing niet overschreven */
  { const a=reqId?D.reqs.find(x=>x.id===reqId):null; ED.req=a?clone(a):null; }
  if(prefill){ Object.keys(prefill).forEach(f=>{ ED.M[f]=prefill[f]; ED.hl.push(f); }); }
  ED.orig=JSON.stringify(ED.M);
  ED.tab = tab || (ED.hl.length ? tabOf(ED.hl[0]==="prijs"?"kostIn":ED.hl[0]) : (ssGet("klimop_uit_edtab")||"fact"));
  detailMode="edit"; renderEdit(t);

const editDirty = () => ED.M && JSON.stringify(Object.fromEntries(Object.entries(ED.M).filter(([k])=>k[0]!=="_")))!==ED.orig;
function edPanes(M,t){

  return {
    alg: sec(0,"Status","",secStatus(M,E,px),{cls:"plain"})+sec(0,"Wat en wanneer","",secWat(M,E,px,W,null),{cls:"plain"})
        +sec(0,"Klassen en deelnemers","",secKlassen(M,E,px,W,null,{admin:true}),{cls:"plain"})+sec(0,"Opmerking","",secOpmerking(M,E,px,{admin:true}),{cls:"plain"}),
    best: sec(0,"Bestemming en organisatie","",secBestemming(M,E,px,{admin:true}),{cls:"plain"})+sec(0,"Vervoer en uren","",secVervoer(M,E,px,W,null),{cls:"plain"}),
    fact: sec(0,"Bus","",secBus(M,E,px),{cls:"plain"})
        +sec(0,"Bestelbon en factuur uitstap","",secUitstapAdmin(M,E,px),{cls:"plain"})
        +sec(0,"Uitstap of activiteit","Kostprijs, betaling en voorschot.",secKosten(M,E,px,W,null,{admin:true}),{cls:"plain"})
        +sec(0,"Mededeling en notitie","",secNotities(M,E,px),{cls:"plain"})
  };
}
function renderEdit(t){
  const req=ED.reqId?D.reqs.find(a=>a.id===ED.reqId):null;
  const h=`<div class="msticky"><div class="modal-head"><div><h3 id="dlgTitle">Bewerken: ${esc(t.activiteit)}</h3><div class="mh-sub">Aanvraag #${esc(t._nr)} · ${esc(fmtLong(t.datumStart))}</div></div>
      <button class="modal-close" data-close="dlgOverlay" aria-label="Sluiten">${ic("x",18)}</button></div>
    <div class="mtabs" role="tablist">${ED_TABS.map(([k,l])=>`<button class="mtab" role="tab" data-etab="${k}" id="etab_${k}" aria-controls="epane_${k}">${l}<span class="mt-dot" hidden></span></button>`).join("")}</div></div>
    ${req?`<div style="padding:14px 24px 0"><div class="finfo">${ic("swap",16)}<div>De gevraagde wijzigingen van ${esc(req.door)} zijn ingevuld en <b>oranje omrand</b>. Kijk ze na en klik op <b>Opslaan</b>; daarna staat de aanvraag op verwerkt.</div></div></div>`:""}
    <div id="edAlert" style="padding:0 24px"></div>
    <div id="edForm" class="ed-form"></div><datalist id="busList">${S().busmaatschappijen.map(b=>`<option value="${esc(b.naam)}">`).join("")}</datalist>
    <div class="modal-foot"><button class="btn btn-ghost" id="edCancel">Annuleren</button><button class="btn btn-primary" id="edSave">${ic("check",16)}Opslaan</button></div>`;
  showDlg("dlg",h,{wide:true}); $("dlg").scrollTop=0;

  $("dlg").onkeydown=e=>{ const b=e.target.closest("[data-etab]"); if(!b||!["ArrowLeft","ArrowRight"].includes(e.key)) return; const i=ED_TABS.findIndex(x=>x[0]===b.dataset.etab), j=(i+(e.key==="ArrowRight"?1:-1)+ED_TABS.length)%ED_TABS.length; setEdTab(ED_TABS[j][0],true); $("etab_"+ED_TABS[j][0]).focus(); };
  const o={px:"e",admin:true,state:ED.state,skipId:t.id};
  o.paint=()=>{ const P=edPanes(ED.M,t);
    $("edForm").innerHTML=ED_TABS.map(([k,l])=>`<div class="mpane" role="tabpanel" id="epane_${k}" aria-labelledby="etab_${k}"${k===ED.tab?"":" hidden"}>${P[k]}</div>`).join("");
    ED.hl.forEach(f=>{ const w=qs(`#edForm [data-f="${f==="prijs"?"kostIn":f}"]`); if(w){ const c=qs(".ctrl,.klas-groups,.rcards",w); if(c) c.classList.add("changed"); } });
    markTabs(); alignLabels($("edForm")); };
  o.onChange=()=>{ $("edAlert").innerHTML=ED.M._tried&&Object.keys(ED.state.E).length?`<div class="form-alert" style="margin:14px 0 0">${ic("alert",16)}<div><b>Nog ${plural(Object.keys(ED.state.E).length,"gegeven","gegevens")} na te kijken.</b> Tabbladen met een rood bolletje bevatten een fout.</div></div>`:""; markTabs(); };

function setEdTab(k,user){
  ED.tab=k; if(user) ssSet("klimop_uit_edtab",k);
  qsa("#dlg .mtab").forEach(b=>{ const on=b.dataset.etab===k; b.classList.toggle("on",on); b.setAttribute("aria-selected",on); b.tabIndex=on?0:-1; });
  qsa("#edForm .mpane").forEach(p=>p.hidden = p.id!=="epane_"+k);
  alignLabels($("edForm"));
  if(user) $("dlg").scrollTop=0;
}
function markTabs(){
  const E=ED.state.E||{};
  ED_TABS.forEach(([k])=>{ const d=qs(`#etab_${k} .mt-dot`); if(d) d.hidden=!Object.keys(E).some(f=>tabOf(f)===k); });
}
async function dismissEdit(id){
  if(editDirty() && !(await confirmDialog({title:"Wijzigingen niet bewaren?",html:"<p>Je hebt wijzigingen die nog niet bewaard zijn.</p>",ok:"Niet bewaren",cancel:"Verder bewerken",tone:"danger"}))) return;
  detailMode="lees"; ED.M=null; renderDetail(id);
}
async function saveEdit(id){
  if(ED.busy) return;
  const M=ED.M; M._tried=true; ED.state.E=validateModel(M,{admin:true});
  const errs=Object.keys(ED.state.E);
  if(errs.length){
    const first=FIELD_ORDER.find(f=>ED.state.E[f])||errs[0];
    ED.tab=tabOf(first);
    const t=tripById(id); const P=edPanes(M,t);
    $("edForm").innerHTML=ED_TABS.map(([k])=>`<div class="mpane" role="tabpanel" id="epane_${k}" aria-labelledby="etab_${k}"${k===ED.tab?"":" hidden"}>${P[k]}</div>`).join("");
    setEdTab(ED.tab); markTabs();
    $("edAlert").innerHTML=`<div class="form-alert" style="margin:14px 0 0">${ic("alert",16)}<div><b>Nog ${plural(errs.length,"gegeven","gegevens")} na te kijken.</b> Tabbladen met een rood bolletje bevatten een fout.</div></div>`;
    focusFirstError($("epane_"+ED.tab),ED.state.E); return;
  }
  const base=ED.base, next=fromModel(M,base,{admin:true});
  const ch=diffTrips(norm(base),next);
  let req=ED.req;
  if(!ch.length && !req){ detailMode="lees"; ED.M=null; renderDetail(id); toast("Geen wijzigingen"); return; }
  ED.busy=true; const b=$("edSave"); b.classList.add("busy"); b.innerHTML=`<span class="spin"></span>Bezig met bewaren…`;
  try{
    /* Verwerk je een aanvraag: staat ze nog open? Anders niets overschrijven en de keuze aan jou laten. */
    if(req){
      const cur=await guarded(()=>API.getReq(req.id)).catch(()=>null);
      const st=cur&&cur.data&&cur.data.status;
      if(cur){ const n=fromReq(cur), i=D.reqs.findIndex(x=>x.id===n.id); if(i>=0) D.reqs[i]=n; }
      if(st && st!=="open"){
        const verder=await confirmDialog({title:"Aanvraag intussen al behandeld",html:`<p>Deze aanvraag werd intussen al <b>${st==="verwerkt"?"verwerkt":"afgewezen"}</b> door iemand anders. Die beslissing blijft staan.</p><p>Wil je je wijzigingen aan de uitstap toch bewaren, los van de aanvraag?</p>`,ok:"Wijzigingen toch bewaren",cancel:"Terug naar bewerken"});
        if(!verder) return;
        req=null; ED.req=null; ED.reqId=null;
        if(!ch.length){ detailMode="lees"; ED.M=null; renderAll(); renderDetail(id); toast("Geen wijzigingen"); return; }
      }
    }
    /* De historiek is openbaar: wijzigingen aan beheergegevens (interne notitie, …) komen er niet in */
    const lbl=[...new Set(ch.filter(f=>!BEHEER_FIELDS.includes(f)).map(f=>FIELD_LBL[f]||f))];
    const logTxt = (lbl.length||req) ? (req?"Wijzigingsaanvraag verwerkt. ":"")+(lbl.length?"Gewijzigd: "+lbl.join(", "):"") : null;
    const saved=await saveTrip(next,base,{log:logTxt?logTxt.trim():null});
    let reqFout=null;
    if(req){ try{ await updateReq(Object.assign({},req,{status:"verwerkt",afgehandeldOp:new Date().toISOString()})); }catch(e){ reqFout=e; } }
    detailMode="lees"; ED.M=null; ED.req=null; renderAll(); renderDetail(id);
    if(reqFout){
      console.error(reqFout);
      toast(reqFout.afgehandeld ? reqFout.message+" Je wijzigingen aan de uitstap zijn wel bewaard."
        : "De wijzigingen aan de uitstap zijn bewaard, maar de aanvraag bleef open ("+(reqFout.network?"geen verbinding":reqFout.rechten?"niet (meer) aangemeld":"fout bij bewaren")+"). Klik bij de aanvraag opnieuw op Verwerken om ze af te sluiten.","err");
      return;
    }
    const ssc=ssChanged(saved);
    toast(ssc.length?"Bewaard. Let op: opnieuw doorgeven aan Smartschool.":"Wijzigingen bewaard");
  }catch(e){
    /* Gedeeltelijk bewaard: de openbare gegevens staan in de database, de interne nog niet.
       Het bewerkvenster blijft open; opnieuw Opslaan bewaart enkel nog wat ontbrak. */
    if(e.partial && e.saved) ED.base=clone(e.saved);
    dbFail(e,"Bewaren");
  }
  finally{ ED.busy=false; const b2=$("edSave"); if(b2){ b2.classList.remove("busy"); b2.innerHTML=ic("check",16)+"Opslaan"; } }
}

    if(e.target.closest("#rqSend")) sendReq(t);
  };
}
async function sendReq(t){
  if(RQ.busy) return;                                   // geen tweede verzending terwijl de eerste loopt
  const v=id=>($(id)?$(id).value.trim():"");
  const naam=v("rq_naam"), toel=v("rq_toel"), errs=[];
  const velden={};
  if(RQ.type==="wijziging"){
    [["datumStart"],["datumEind"],["vertrekSchool"],["terug"],["terugSchool"]].forEach(([f])=>{ const x=v("rq_"+f); if(x && x!==t[f]) velden[f]=x; });
    ["aantalLln","aantalBegeleiders"].forEach(f=>{ const x=v("rq_"+f); if(x!==""){ if(!isInt(x)) errs.push(`${REQ_LBL[f]}: gebruik een heel getal.`); else if(+x!==t[f]) velden[f]=+x; } });
    const a=sortKlassen(RQ.klassen), b=sortKlassen(t.klassen);
    if(JSON.stringify(a)!==JSON.stringify(b)){ if(!a.length) errs.push("Kies minstens één klas."); else velden.klassen=a; }
    const pr=v("rq_prijs"); if(pr){ const n=parseEuro(pr); if(n==null||isNaN(n)) errs.push("Prijs: geen geldig bedrag."); else velden.prijs={kostIn:euroIn(n),kostprijsBasis:RQ.basis}; }
    if(velden.datumStart && t.type==="meerdaags" && !velden.datumEind) errs.push("Geef ook de nieuwe einddatum.");
    if(!Object.keys(velden).length && !toel) errs.push("Duid aan wat er moet veranderen, of beschrijf het in de toelichting.");
  } else if(!toel) errs.push("Geef aan waarom de uitstap niet doorgaat.");
  if(!naam) errs.push("Vul je naam in.");
  if(errs.length){ $("rqErr").innerHTML=`<div class="form-alert" style="margin:0">${ic("alert",16)}<div>${errs.map(esc).join("<br>")}</div></div>`; return; }
  const b=$("rqSend"); RQ.busy=true; b.disabled=true; b.classList.add("busy"); b.innerHTML=`<span class="spin"></span>Bezig met versturen…`;
  /* Dezelfde id bij een nieuwe poging: kwam de eerste toch aan, dan ontstaat er geen tweede aanvraag */
  if(!RQ.pendingId) RQ.pendingId=uid();
  try{
    await insertReq({id:RQ.pendingId,uitstapId:t.id,type:RQ.type,velden,toelichting:toel,door:naam,op:new Date().toISOString(),status:"open"});
    RQ.pendingId=null; savePrefs({naam}); closeDlg("dlg2"); renderAll(); renderDetail(t.id,true);
    toast("Aanvraag verstuurd. De administratie verwerkt ze.");
  }catch(e){ dbFail(e,"Versturen"); b.disabled=false; b.classList.remove("busy"); b.innerHTML=ic("send",16)+"Aanvraag versturen"; }
  finally{ RQ.busy=false; }
}
function processReq(t,a){
  if(a.type==="annulering"){ startEdit(t,{planStatus:"geannuleerd",annuleringReden:a.toelichting||""},a.id); return; }
  const pre={};
  Object.entries(a.velden||{}).forEach(([f,v])=>{
    if(f==="prijs"){ pre.prijsStatus="bekend"; pre.kostIn=v.kostIn; pre.kostprijsBasis=v.kostprijsBasis; }
    else if(f==="aantalLln"||f==="aantalBegeleiders") pre[f]=String(v);
    else pre[f]=v;
  });
  startEdit(t,pre,a.id);
}
function rejectReq(t,a){
  const h=`<div class="modal-head"><div><h3 id="dlg2Title">Aanvraag afwijzen</h3><div class="mh-sub">${esc(t.activiteit)} · aanvraag van ${esc(a.door)}</div></div><button class="modal-close" data-close="dlg2Overlay" aria-label="Sluiten">${ic("x",18)}</button></div>
    <div class="modal-body"><div class="field"><label for="rjReden">Reden (de leerkracht ziet dit) <span class="req">*</span></label><textarea class="ctrl" id="rjReden" rows="3" placeholder="bv. de bus is al vastgelegd op dat uur"></textarea></div><div id="rjErr"></div></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close="dlg2Overlay">Annuleren</button><button class="btn btn-coral" id="rjDo">Afwijzen</button></div>`;
  showDlg("dlg2",h,{wide:false,focus:"#rjReden"});
  $("dlg2").onclick=async e=>{
    if(!e.target.closest("#rjDo")) return;
    const r=$("rjReden").value.trim(); if(!r){ $("rjErr").innerHTML=`<div class="ferr">${ic("alert",14)}<span>Geef een reden.</span></div>`; return; }
    const knop=$("rjDo"); if(knop.disabled) return; knop.disabled=true;
    try{ await updateReq(Object.assign({},a,{status:"afgewezen",antwoord:r,afgehandeldOp:new Date().toISOString()})); closeDlg("dlg2"); renderAll(); renderDetail(t.id,true); toast("Aanvraag afgewezen"); }
    catch(err){ if(err.afgehandeld){ closeDlg("dlg2"); renderAll(); renderDetail(t.id,true); } else knop.disabled=false; dbFail(err,"Afwijzen"); }
  };
}

/* ---------- Agenda (.ics) ---------- */
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
/* Regels afbreken op 75 bytes (UTF-8), nooit midden in een teken; vervolgregels beginnen met een spatie */
function icsFold(line){
  const enc=new TextEncoder(); let out="", cur="", n=0;
  for(const ch of line){ const b=enc.encode(ch).length; if(n+b>75){ out+=cur+"\r\n "; cur=""; n=1; } cur+=ch; n+=b; }
  return out+cur;
}
/* Einde van een daguitstap: het opgegeven uur als dat na het vertrek ligt, anders één uur later (ook over middernacht) */
function icsEinde(t){
  const e=t.terugSchool||t.terug;
  if(e && e>t.vertrekSchool) return {d:t.datumStart,t:e};
  const [h,m]=t.vertrekSchool.split(":").map(Number), s=parseISO(t.datumStart), x=new Date(s.getFullYear(),s.getMonth(),s.getDate(),h+1,m);
  return {d:toISO(x),t:`${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}`};
}
function downloadIcs(t){
  if(t._datumFout){ toast("Deze uitstap heeft geen geldige datum. Pas eerst de datum aan.","err"); return; }
  const d=s=>s.replace(/-/g,""), tm=x=>x.replace(":","")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//GO! basisschool Klim-Op//Uitstappen//NL","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:${t.id}@uitstappen.klimop`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`];
  if(t.type==="dag" && t.vertrekSchool){ const e=icsEinde(t); L.push(`DTSTART:${d(t.datumStart)}T${tm(t.vertrekSchool)}`); L.push(`DTEND:${d(e.d)}T${tm(e.t)}`); }
  else { L.push(`DTSTART;VALUE=DATE:${d(t.datumStart)}`); L.push(`DTEND;VALUE=DATE:${d(addDays(tripEnd(t),1))}`); }
  L.push(`SUMMARY:${icsEsc(t.activiteit+" ("+sortKlassen(t.klassen).join(", ")+")")}`);
  if(bestemming(t)) L.push(`LOCATION:${icsEsc(bestemming(t))}`);
  L.push(`DESCRIPTION:${icsEsc(ssText(t)+(t.contactTel?"\nTelefoon: "+t.contactTel:""))}`);
  L.push("END:VEVENT","END:VCALENDAR");
  download(`uitstap_${t.datumStart}_${t.activiteit.replace(/[^\w-]+/g,"_").slice(0,30)}.ics`,L.map(icsFold).join("\r\n"),"text/calendar;charset=utf-8");
  toast("Agenda-bestand gedownload");
}

/* ============================================================
   KALENDER (september t.e.m. augustus, vakanties als band)
   ============================================================ */
function calRange(){ const a=sjShift(huidigSJ(),-1), b=sjShift(huidigSJ(),1); return [sjRange(a)[0].slice(0,7), sjRange(b)[1].slice(0,7)]; }
function monthAdd(ym,n){ let y=+ym.slice(0,4), m=+ym.slice(5,7)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return `${y}-${String(m+1).padStart(2,"0")}`; }
function calItems(from,to){
  const items=[], set=S();
  set.vakanties.forEach(v=>{ if(v.van<=to && v.tot>=from) items.push({kind:"vak",s:v.van,e:v.tot,naam:v.naam}); });
  set.vrijedagen.forEach(v=>{ if(v.datum>=from && v.datum<=to) items.push({kind:"vak",s:v.datum,e:v.datum,naam:v.naam}); });
  set.meldingen.forEach(m=>{ const e=m.datumEind||m.datum; if(m.datum<=to && e>=from) items.push({kind:"melding",s:m.datum,e,naam:m.naam,m}); });
  liveTrips().forEach(t=>{ if(t._datumFout) return; const e=tripEnd(t); if(t.datumStart<=to && e>=from && (!ui.klas||t.klassen.includes(ui.klas))) items.push({kind:t.type==="meerdaags"?"meer":"dag",s:t.datumStart,e,naam:t.activiteit,t}); });
  const rank={vak:0,meer:1,melding:2,dag:3};
  return items.sort((a,b)=>(a.kind==="vak"?0:1)-(b.kind==="vak"?0:1)||a.s.localeCompare(b.s)||daysBetween(b.s,b.e)-daysBetween(a.s,a.e)||rank[a.kind]-rank[b.kind]);
}
function dayClass(d,ym){
  const set=S(), c=["wd"];
  if(d.slice(0,7)!==ym) c.push("out");
  const w=dow(d); if(w===0||w===6) c.push("weekend");
  if(set.vakanties.some(v=>d>=v.van&&d<=v.tot)) c.push("vakantie"); else if(set.vrijedagen.some(v=>v.datum===d)) c.push("feestdag");
  if(d===todayISO()) c.push("today");
  if(isAdmin) c.push("click");
  return c.join(" ");
}
function barHTML(it,col,span,contL,contR){
  const cls=["bar",it.kind]; if(contL) cls.push("contL"); if(contR) cls.push("contR");
  if(it.t && isCancel(it.t)) cls.push("cancel");
  if(it.kind==="vak") return `<div class="${cls.join(" ")}" style="grid-column:${col}/span ${span}" title="${esc(it.naam)}"><span class="b-name">${esc(it.naam)}</span></div>`;
  const t=it.t;
  const flag = t && isAdmin && issues(t).some(i=>["bus","boeken","aanvragen"].includes(i.k)) ? `<span class="flagdot" title="Actie nodig"></span>` : "";
  const icn = t && t.busNodig ? `<span class="b-ic">${ic("bus",13)}</span>` : "";
  const kl = t ? `<span class="b-klas">${esc(sortKlassen(t.klassen).join(", "))}</span>` : "";
  const attr = t ? `data-trip="${esc(t.id)}" tabindex="0" role="button" aria-label="${esc(t.activiteit+", "+fmtLong(t.datumStart)+", "+t.klassen.join(", "))}"` : `data-mel="${esc(it.m.id)}"${isAdmin?' tabindex="0" role="button"':""} aria-label="${esc("Melding: "+it.naam)}"`;
  return `<div class="${cls.join(" ")}" style="grid-column:${col}/span ${span}" ${attr}>${flag}${icn}<span class="b-name">${esc(it.naam)}</span>${kl}</div>`;
}
function renderKalender(){
  const host=$("view-kalender");
  const [rMin,rMax]=calRange();
  if(!ui.calMonth) ui.calMonth=todayISO().slice(0,7);
  if(ui.calMonth<rMin) ui.calMonth=rMin; if(ui.calMonth>rMax) ui.calMonth=rMax;
  const ym=ui.calMonth, y=+ym.slice(0,4), m=+ym.slice(5,7)-1;
  let months=[], cur=rMin; while(cur<=rMax){ months.push(cur); cur=monthAdd(cur,1); }
  const optgroups=[...new Set(months.map(x=>schooljaarVan(x+"-01")))].map(sj=>`<optgroup label="Schooljaar ${sj}">${months.filter(x=>schooljaarVan(x+"-01")===sj).map(x=>`<option value="${x}"${x===ym?" selected":""}>${cap(MAANDEN[+x.slice(5,7)-1])} ${x.slice(0,4)}</option>`).join("")}</optgroup>`).join("");
  const klOpts=`<option value="">Alle klassen</option>`+S().klassen.filter(k=>k.actief).map(k=>`<option${ui.klas===k.naam?" selected":""}>${esc(k.naam)}</option>`).join("");
  /* weken */
  const first=`${ym}-01`, fd=(dow(first)+6)%7, start=addDays(first,-fd);
  const last=toISO(new Date(y,m+1,0)), ld=(dow(last)+6)%7, end=addDays(last,6-ld);
  const items=calItems(start,end);
  let weeks="", ws=start;
  while(ws<=end){
    const we=addDays(ws,6), days=[...Array(7)].map((_,i)=>addDays(ws,i));
    const lanes=[]; let bars="";
    items.filter(it=>it.s<=we && it.e>=ws).forEach(it=>{
      const s=it.s<ws?ws:it.s, e=it.e>we?we:it.e, col=daysBetween(ws,s)+1, span=daysBetween(s,e)+1;
      let lane=lanes.findIndex(l=>l<col); if(lane<0){ lane=lanes.length; lanes.push(0); } lanes[lane]=col+span-1;
      bars+=barHTML(it,col,span,it.s<ws,it.e>we).replace('style="',`style="grid-row:${lane+1};`);
    });
    weeks+=`<div class="cal-week"><div class="week-days cal-cols">${days.map(d=>`<div class="${dayClass(d,ym)}" data-day="${d}"><div class="wd-num"><span>${parseISO(d).getDate()}</span></div></div>`).join("")}</div>
      <div class="week-events cal-cols" style="min-height:${Math.max(104,34+lanes.length*28)}px">${bars}</div></div>`;
    ws=addDays(ws,7);
  }
  /* agenda voor kleine schermen */
  const mItems=calItems(first,last); let ag="";
  for(let d=first; d<=last; d=addDays(d,1)){
    const its=mItems.filter(it=>it.s<=d && it.e>=d && (it.s===d || d===first));
    if(!its.length) continue;
    ag+=`<div class="ag-day"><div class="ag-date">${esc(cap(fmtD(d)))}${d===todayISO()?'<span class="today">vandaag</span>':""}</div>${its.map(it=>{
      if(it.kind==="vak") return `<div class="ag-item vak"><div><b>${esc(it.naam)}</b>${it.s!==it.e?`<small>${esc(fmtD(it.s))} t.e.m. ${esc(fmtD(it.e))}</small>`:""}</div></div>`;
      if(it.kind==="melding") return `<div class="ag-item melding" data-mel="${esc(it.m.id)}"${isAdmin?' tabindex="0" role="button"':""}><div><b>${esc(it.naam)}</b><small>Melding</small></div></div>`;
      const t=it.t; return `<div class="ag-item ${it.kind}" data-trip="${esc(t.id)}" tabindex="0" role="button"><span>${ic(VERVOER[vervoer(t)]?VERVOER[vervoer(t)].ic:"cal",16)}</span><div style="min-width:0"><b${isCancel(t)?' style="text-decoration:line-through"':""}>${esc(t.activiteit)}</b><small>${esc(sortKlassen(t.klassen).join(", "))}${t.vertrekSchool?" · vertrek "+esc(fmtTime(t.vertrekSchool)):""}${t.type==="meerdaags"?" · t.e.m. "+esc(fmtD(t.datumEind)):""}${isCancel(t)?" · geannuleerd":""}</small></div></div>`;
    }).join("")}</div>`;
  }
  host.innerHTML=`<div class="cal-top">
      <div class="cal-nav"><button class="icon-btn" id="calPrev" aria-label="Vorige maand"${ym<=rMin?" disabled":""}>${ic("chevL",18)}</button><button class="icon-btn" id="calNext" aria-label="Volgende maand"${ym>=rMax?" disabled":""}>${ic("chevR",18)}</button></div>
      <div class="cal-month" aria-live="polite">${cap(MAANDEN[m])} <span>${y}</span></div>
      <button class="btn btn-ghost btn-sm" id="calToday">Vandaag</button>
      <span class="tb-space"></span>
      <select class="sel" id="calMonthSel" aria-label="Kies een maand">${optgroups}</select>
      <select class="sel${ui.klas?" set":""}" id="calKlas" aria-label="Filter op klas">${klOpts}</select>
      <button class="btn btn-ghost btn-sm" id="calPrint">${ic("printer",15)}Afdrukken</button>
    </div>
    <div class="cal-legend"><span><i class="lg" style="background:var(--teal-l);box-shadow:inset 3px 0 0 var(--teal)"></i>Uitstap</span><span><i class="lg" style="background:#ffe9e6;box-shadow:inset 3px 0 0 var(--coral)"></i>Meerdaags</span>
      <span><i class="lg" style="background:#eef2f2;box-shadow:inset 3px 0 0 var(--slate-l)"></i>Melding</span><span><i class="lg" style="background:var(--sand)"></i>Vakantie of vrije dag</span>
      ${isAdmin?`<span><i class="flagdot" style="width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block"></i>Actie nodig</span><span class="muted">Klik op een lege dag om een melding toe te voegen.</span>`:""}</div>
    <div class="cal"><div class="cal-dow cal-cols">${["Ma","Di","Wo","Do","Vr","Za","Zo"].map(d=>`<div>${d}</div>`).join("")}</div>${weeks}</div>
    <div class="agenda card">${ag||`<div class="ag-empty">Niets gepland in ${MAANDEN[m]}.</div>`}</div>`;
  $("calPrev").onclick=()=>{ ui.calMonth=monthAdd(ym,-1); renderKalender(); $("calPrev").focus(); };

/* ---------- Maand afdrukken ---------- */
function printMonth(ym){
  const y=+ym.slice(0,4), m=+ym.slice(5,7)-1, first=`${ym}-01`, last=toISO(new Date(y,m+1,0));
  const start=addDays(first,-((dow(first)+6)%7)), end=addDays(last,6-((dow(last)+6)%7)), items=calItems(start,end);
  let rows="";
  for(let ws=start; ws<=end; ws=addDays(ws,7)){
    rows+="<tr>"+[...Array(7)].map((_,i)=>{ const d=addDays(ws,i), its=items.filter(it=>it.s<=d&&it.e>=d), vak=its.find(it=>it.kind==="vak");
      return `<td class="${i>4?"we ":""}${vak?"pv":""}"><div class="pd">${d.slice(0,7)===ym?parseISO(d).getDate():""}</div>${d.slice(0,7)!==ym?"":its.map(it=>it.kind==="vak"?(it.s===d||d===first||i===0?`<span class="psmall">${esc(it.naam)}</span>`:""):`<span class="pe ${it.kind==="meer"?"m":it.kind==="melding"?"n":""}">${esc(it.naam)}${it.t?` <span class="psmall">${esc(sortKlassen(it.t.klassen).join(", "))}${it.t.vertrekSchool&&it.s===d?" · "+esc(fmtTime(it.t.vertrekSchool)):""}</span>`:""}</span>`).join("")}</td>`; }).join("")+"</tr>";
  }
  $("printArea").innerHTML=printHead(`Kalender ${MAANDEN[m]} ${y}`,`${ui.klas?"Klas "+esc(ui.klas)+"<br>":""}afgedrukt op ${esc(fmtDY(todayISO()))}`)+
    `<table class="pcal"><thead><tr>${["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Za","Zo"].map((d,i)=>`<th${i>4?' class="we"':""}>${d}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  printPage("A4 landscape"); setTimeout(()=>window.print(),60);
}

const OF = { all:false, sel:new Set(), km:{}, opm:{} };
function offerteKandidaten(metOpgevraagd){
  const vandaag=todayISO();
  return liveTrips().filter(t=>t.busNodig && !isCancel(t) && t.datumStart>=vandaag && (t.busStatus==="teregelen" || (metOpgevraagd && t.busStatus==="offertes")))
    .sort((a,b)=>a.datumStart.localeCompare(b.datumStart)||((a._nr||0)-(b._nr||0)));
}
/* Bestemming zoals in het sjabloon: naam, adres */
function offerteBestemming(t){
  const naam = t.locatieAnders ? (t.locNaam||t.activiteit) : t.activiteit;
  const adr = t.locatieAnders ? [[t.locStraat,t.locNummer].filter(Boolean).join(" "),[t.locPostcode,t.locStad].filter(Boolean).join(" ")].filter(Boolean).join(", ") : adres(t);
  return [naam,adr].filter(Boolean).join(", ");
}
/* Afstand van een vorige rit naar dezelfde bestemming */
function kmVorige(t){
  const b=fold(offerteBestemming(t));
  const h=[...D.trips,...D.arch].filter(x=>x.id!==t.id && x.busKm!=null && fold(offerteBestemming(x))===b).sort((a,c)=>c.datumStart.localeCompare(a.datumStart))[0];
  return h ? h.busKm : null;
}
const xlUur = v => v ? `${+v.slice(0,2)}u${v.slice(3,5)}` : "";

function offerteMist(t){
  const m=[]; if(!t.vertrekSchool) m.push("vertrekuur"); if(!t.terug) m.push("uur terugrit");
  if(!bestemmingStad(t)) m.push("adres"); return m;
}

async function offerteDownload(){
  const sel=offerteKandidaten(OF.all).filter(t=>OF.sel.has(t.id)); if(!sel.length) return;
  const bad=sel.filter(t=>isNaN(parseKm(OF.km[t.id])));

  const set=OFF(), rows=[];
  sel.forEach(t=>{
    const km=parseKm(OF.km[t.id]), opm=String(OF.opm[t.id]||"").trim(), pers=t.aantalLln+(t.aantalBegeleiders||0), best=offerteBestemming(t);
    const extra = s => [s,opm].filter(Boolean).join(" · ");

      rows.push({datum:t.datumStart,uur:xlUur(t.vertrekSchool),enkel:"x",retour:"",van:set.vertrek,naar:best,km,pers,opm:extra("meerdaagse uitstap: heenrit")});

    } else rows.push({datum:t.datumStart,uur:xlUur(t.vertrekSchool),enkel:"",retour:t.terug?xlUur(t.terug):"uur volgt",van:set.vertrek,naar:best,km,pers,opm});
  });
  downloadBlob(`offerteaanvraag_busritten_${todayISO()}.xlsx`, buildBusXlsx(set,rows));
  const nieuw=sel.filter(t=>t.busStatus==="teregelen");
  const zet = nieuw.length ? await confirmDialog({title:"Status bijwerken?",html:`<p>Het Excel-bestand is gedownload. Zet ${nieuw.length===1?"deze rit":`deze ${nieuw.length} ritten`} op <b>Offertes opgevraagd</b> (vandaag)? Ze verschijnen dan niet meer in deze lijst.</p>`,ok:"Ja, bijwerken",cancel:"Nee, nog niet"}) : false;
  let fout=0, gedaan=0;
  for(const t of sel){
    const km=parseKm(OF.km[t.id]), opm=String(OF.opm[t.id]||"").trim(), st=zet && t.busStatus==="teregelen";
    if(!st && km===t.busKm && opm===(t.busOfferteOpm||"")) continue;

    catch(e){ fout++; }
  }
  closeDlg("dlg"); renderAll();
  if(fout) toast(`Excel gedownload, maar ${plural(fout,"rit kon","ritten konden")} niet bijgewerkt worden (geen verbinding). Probeer opnieuw.`,"err");
  else toast(gedaan ? `Excel gedownload · ${plural(gedaan,"rit","ritten")} op Offertes opgevraagd` : "Excel gedownload");
}

/* ---------- Excel (.xlsx) zonder externe bibliotheek ---------- */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC_T[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipBlob(files,type){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  const d=new Date(), tm=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dt=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(f=>{
    const nm=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,tm,true); lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,tm,true); ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+data.length;
  });
  const size=cd.reduce((s,a)=>s+a.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,size,true); end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type});
}
const xmlEsc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
function xlSerial(iso){ const [y,m,d]=iso.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000); }
/* Professionele opmaak (zelfde inhoud en kolomvolgorde als het sjabloon van de scholengroep) */

const AR = { years:null };
async function archYears(){
  if(AR.years) return AR.years;
  const ys=await API.years(); AR.years=[...new Set(ys)].filter(Boolean).sort().reverse(); return AR.years;
}
async function ensureYear(sj){
  if(D.archYears.has(sj)) return;
  if(sj>=sjShift(huidigSJ(),-1)){ D.archYears.add(sj); return; }   // zit al in de gewone lading
  const rows=await guarded(()=>API.loadYear(sj));
  D.arch=D.arch.filter(t=>schooljaarVan(t.datumStart)!==sj).concat(rows.map(fromRow)); D.archYears.add(sj);
}
function tripsOfYear(sj){ return [...D.trips,...D.arch].filter(t=>!t.verwijderdOp && schooljaarVan(t.datumStart)===sj).sort((a,b)=>a.datumStart.localeCompare(b.datumStart)); }

async function removeWithUndo(coll,id,msg){
  const arr=S()[coll], idx=arr.findIndex(x=>x.id===id); if(idx<0) return;
  const item=clone(arr[idx]);
  try{
    await mutateSettings(s=>{ s[coll]=s[coll].filter(x=>x.id!==id); }); renderAll();
    toast(msg,"ok",{label:"Ongedaan maken",fn:async()=>{ try{ await mutateSettings(s=>{ if(!s[coll].some(x=>x.id===id)) s[coll].splice(Math.min(idx,s[coll].length),0,item); }); renderAll(); toast("Teruggezet"); }catch(e){ dbFail(e,"Terugzetten"); } }});
  }catch(e){ dbFail(e,"Verwijderen"); }
}
